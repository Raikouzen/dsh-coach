<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Coach">
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#12131a" />
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" fill="none" stroke="#2c2f3e" stroke-width="1.5" />
  <!-- a calm dial: the outer ring is the session, the needle is the current ask -->
  <circle cx="32" cy="28" r="13.5" fill="none" stroke="#3b3f56" stroke-width="2.5" />
  <path d="M32 28 L38.4 21.2" stroke="#8b9dff" stroke-width="3" stroke-linecap="round" />
  <circle cx="32" cy="28" r="2.4" fill="#8b9dff" />
  <!-- five marks under the dial: the draft meter -->
  <circle cx="20" cy="49" r="2.1" fill="#4ade80" />
  <circle cx="26" cy="49" r="2.1" fill="#4ade80" />
  <circle cx="32" cy="49" r="2.1" fill="#fbbf24" />
  <circle cx="38" cy="49" r="2.1" fill="#3b3f56" />
  <circle cx="44" cy="49" r="2.1" fill="#3b3f56" />
</svg>
